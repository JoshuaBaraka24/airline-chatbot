recipe: default.v1
language: en

pipeline:
- name: WhitespaceTokenizer
# Sparse features: regex/lookup matches, word shape and n-grams. These give
# DIET strong signals for short inputs like "BK001" or "agent" that BERT
# embeddings alone separate poorly.
- name: RegexFeaturizer
  case_sensitive: false
  use_lookup_tables: true
  use_regexes: true
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
# Dense contextual features from pre-trained BERT
- name: LanguageModelFeaturizer
  model_name: "bert"
  model_weights: "bert-base-uncased"
- name: DIETClassifier
  epochs: 100
  constrain_similarities: true
  entity_recognition: true
- name: EntitySynonymMapper
- name: FallbackClassifier
  threshold: 0.6
  ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
- name: RulePolicy
  core_fallback_threshold: 0.3
  core_fallback_action_name: action_default_fallback
  enable_fallback_prediction: true
- name: TEDPolicy
  max_history: 5
  epochs: 100
  constrain_similarities: true
assistant_id: 20260917-105201-flush-mainmast
