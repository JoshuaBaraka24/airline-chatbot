<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings · Kenya Airways Virtual Assistant</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="account">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <div class="page-head">
      <h1 id="account-title">My bookings</h1>
      <p id="account-subtitle">Loading your trips…</p>
    </div>
    <div class="alert" id="bookings-error" role="alert" hidden></div>
    <div class="bookings" id="bookings" aria-labelledby="account-title" aria-busy="true"></div>
    <div class="card empty" id="bookings-empty" hidden>
      <img src="assets/illustrations/empty-suitcase.svg" alt="" width="240" height="180">
      <h2>No bookings yet</h2>
      <p class="muted">The assistant can find flights for you.</p>
      <button type="button" class="btn btn--primary" id="find-flights">Find a flight</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <template id="booking-template">
    <article class="card booking">
      <img class="booking__banner booking__banner--photo" alt="" width="400" height="120">
      <div class="booking__content">
      <div class="booking__top">
        <span class="booking__ref"></span>
        <span class="booking__status"></span>
      </div>
      <div class="booking__route">
        <div class="booking__city booking__city--from"><span class="from-city"></span><small class="from-time"></small></div>
        <svg class="booking__plane" aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" focusable="false"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>
        <div class="booking__city booking__city--to"><span class="to-city"></span><small class="to-time"></small></div>
      </div>
      <div class="booking__meta">
        <span class="meta-flight"></span>
        <span class="meta-flight-status"></span>
      </div>
      <div class="booking__actions"></div>
      </div>
    </article>
  </template>

  <script src="api.js"></script>
  <script src="site.js"></script>
  <script src="voice.js"></script>
  <script src="chat.js"></script>
  <script src="account.js"></script>
</body>
</html>
