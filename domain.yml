version: "3.1"

intents:
  - greet
  - goodbye
  - thank_you
  - bot_capabilities
  - check_flight_status
  - change_booking
  - cancel_booking
  - new_booking
  - baggage_policy
  - check_in_procedure
  - check_in_status
  - escalate_to_agent
  - out_of_scope
  - inform
  - affirm
  - deny

entities:
  - flight_number
  - booking_reference
  - date
  - city:
      roles:
        - from
        - to

# All slots are filled through forms, so none of them steer dialogue
# predictions directly (influence_conversation: false).
# The from_text mappings capture the raw reply when NLU misses an entity;
# the form validators in actions/forms.py then parse and check it.
slots:
  flight_number:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: flight_number
      - type: from_text
        not_intent: [deny, escalate_to_agent]
        conditions:
          - active_loop: flight_status_form
            requested_slot: flight_number

  booking_reference:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: booking_reference
      - type: from_text
        not_intent: [deny, escalate_to_agent]
        conditions:
          - active_loop: check_in_status_form
            requested_slot: booking_reference
          - active_loop: cancel_booking_form
            requested_slot: booking_reference
          - active_loop: change_booking_form
            requested_slot: booking_reference

  travel_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: date
      - type: from_text
        not_intent: [deny, escalate_to_agent]
        conditions:
          - active_loop: change_booking_form
            requested_slot: travel_date
          - active_loop: new_booking_form
            requested_slot: travel_date

  origin:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: city
        role: from
      - type: from_entity
        entity: city
        conditions:
          - active_loop: new_booking_form
            requested_slot: origin
      - type: from_text
        not_intent: [deny, escalate_to_agent]
        conditions:
          - active_loop: new_booking_form
            requested_slot: origin

  destination:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: city
        role: to
      - type: from_entity
        entity: city
        conditions:
          - active_loop: new_booking_form
            requested_slot: destination
      - type: from_text
        not_intent: [deny, escalate_to_agent]
        conditions:
          - active_loop: new_booking_form
            requested_slot: destination

  confirm_cancel:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: cancel_booking_form
            requested_slot: confirm_cancel
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: cancel_booking_form
            requested_slot: confirm_cancel

  confirm_change:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: change_booking_form
            requested_slot: confirm_change
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: change_booking_form
            requested_slot: confirm_change

  # Set by validate_change_booking_form once a new flight is found
  new_flight_id:
    type: any
    influence_conversation: false
    mappings:
      - type: custom

forms:
  flight_status_form:
    required_slots:
      - flight_number
  check_in_status_form:
    required_slots:
      - booking_reference
  cancel_booking_form:
    required_slots:
      - booking_reference
      - confirm_cancel
  change_booking_form:
    required_slots:
      - booking_reference
      - travel_date
      - confirm_change
  new_booking_form:
    required_slots:
      - origin
      - destination
      - travel_date

responses:
  utter_greet:
    - text: "Hello! I'm the Kenya Airways virtual assistant. I can check flight status, help you book, change or cancel a flight, check your check-in status and answer baggage questions. How can I help?"
      buttons:
        - title: "Flight Status"
          payload: "/check_flight_status"
        - title: "Baggage"
          payload: "/baggage_policy"
        - title: "Change Booking"
          payload: "/change_booking"
        - title: "Check-In"
          payload: "/check_in_procedure"
  utter_greet_in_form:
    - text: "Hello again! Let's carry on."
  utter_goodbye:
    - text: "Goodbye, and thank you for flying Kenya Airways!"
  utter_you_are_welcome:
    - text: "You're welcome! Is there anything else I can help you with?"
  utter_bot_capabilities:
    - text: "I can help you with:\n- Flight status\n- New bookings (flight search)\n- Changing or cancelling a booking\n- Check-in status and procedure\n- Baggage allowance\nWhat do you need?"
      buttons:
        - title: "Flight Status"
          payload: "/check_flight_status"
        - title: "New Booking"
          payload: "/new_booking"
        - title: "Change Booking"
          payload: "/change_booking"
        - title: "Cancel Booking"
          payload: "/cancel_booking"

  utter_ask_flight_number:
    - text: "Please provide your flight number (e.g. KQ101)."
  utter_ask_booking_reference:
    - text: "Please provide your booking reference (e.g. BK001)."
  utter_ask_change_booking_form_travel_date:
    - text: "What date would you like to move your flight to? (e.g. 25 October)"
  utter_ask_new_booking_form_travel_date:
    - text: "What date would you like to travel? (e.g. 25 October)"
  utter_ask_origin:
    - text: "Where are you flying from?"
  utter_ask_destination:
    - text: "Where would you like to fly to?"

  utter_how_can_i_help:
    - text: "Great! What can I help you with? You can ask about flight status, bookings, check-in or baggage."
  utter_no_problem:
    - text: "Alright. Let me know if there's anything else I can help with."
  utter_task_stopped:
    - text: "No problem, I've stopped that request. Is there anything else I can help with?"
  utter_escalate:
    - text: "I'm connecting you to a Kenya Airways agent now. Please hold. You can also call us on +254 20 327 4747."
  utter_out_of_scope:
    - text: "I'm sorry, I can only assist with flight status, baggage, check-in, and bookings. For other queries, please call +254 20 327 4747."
  utter_baggage_policy:
    - text: "Kenya Airways baggage allowance:\n- Economy: checked bags up to 23kg each\n- Business: checked bags up to 32kg each\n- Cabin: one bag up to 12kg\nNo single bag may weigh more than 32kg; heavier items must be sent as cargo. Overweight and extra bags are charged and can be bought in advance at kenyaairways.com. Your exact allowance depends on route and fare, so check your e-ticket."
  utter_check_in_procedure:
    - text: "You can check in online at kenyaairways.com from 36 hours before departure, or at the airport counter 3 hours before. Have your booking reference and a valid passport or ID ready."
  utter_default:
    - text: "I didn't understand that. Could you rephrase? Or type 'agent' to speak to a human."

actions:
  - action_check_flight_status
  - action_check_in_status
  - action_cancel_booking
  - action_change_booking
  - action_new_booking
  - action_escalate_to_agent
  - action_handle_fallback
  - action_stop_task
  - action_ask_confirm_cancel
  - action_ask_confirm_change
  - validate_flight_status_form
  - validate_check_in_status_form
  - validate_cancel_booking_form
  - validate_change_booking_form
  - validate_new_booking_form

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
