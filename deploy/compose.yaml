# Runs the system on a server, with Caddy providing HTTPS.
# On the server: docker compose -f deploy/compose.yaml up -d --build
# Settings come from the .env file in the project root (see docs/deployment.md).
name: airline-assistant

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    volumes:
      - pgdata:/home/user/pgdata
    restart: unless-stopped
    # Not published: only Caddy can reach it

  caddy:
    image: caddy:2.8
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
