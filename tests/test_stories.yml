version: "3.1"

# End-to-end conversation tests. Run with: rasa test core --stories tests/test_stories.yml
# Each step checks the predicted intent (from the raw user text) and the next action.

stories:

- story: greet and ask what the bot can do
  steps:
  - user: |
      hello there
    intent: greet
  - action: utter_greet
  - user: |
      what services do you provide
    intent: bot_capabilities
  - action: utter_bot_capabilities

- story: flight status in one message
  steps:
  - user: |
      what is the status of flight [KQ101](flight_number)?
    intent: check_flight_status
  - action: flight_status_form
  - active_loop: flight_status_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_flight_status

- story: flight status over two turns
  steps:
  - user: |
      is my flight delayed?
    intent: check_flight_status
  - action: flight_status_form
  - active_loop: flight_status_form
  - slot_was_set:
    - requested_slot: flight_number
  - user: |
      [KQ202](flight_number)
    intent: inform
  - action: flight_status_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_flight_status

- story: cancel booking with confirmation
  steps:
  - user: |
      I want to cancel my booking
    intent: cancel_booking
  - action: cancel_booking_form
  - active_loop: cancel_booking_form
  - slot_was_set:
    - requested_slot: booking_reference
  - user: |
      [BK001](booking_reference)
    intent: inform
  - action: cancel_booking_form
  - slot_was_set:
    - requested_slot: confirm_cancel
  - user: |
      yes
    intent: affirm
  - action: cancel_booking_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_cancel_booking

- story: change booking, then stop midway
  steps:
  - user: |
      I need to change my flight
    intent: change_booking
  - action: change_booking_form
  - active_loop: change_booking_form
  - slot_was_set:
    - requested_slot: booking_reference
  - user: |
      never mind
    intent: deny
  - action: action_deactivate_loop
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_stop_task

- story: new booking with route in first message
  steps:
  - user: |
      can you help me book a flight from [Nairobi]{"entity": "city", "role": "from"} to [Dubai]{"entity": "city", "role": "to"}
    intent: new_booking
  - action: new_booking_form
  - active_loop: new_booking_form
  - slot_was_set:
    - requested_slot: travel_date
  - user: |
      [next Friday](date)
    intent: inform
  - action: new_booking_form
  - slot_was_set:
    - requested_slot: selected_flight_id
  - user: |
      the first one
    intent: inform
  - action: new_booking_form
  - slot_was_set:
    - requested_slot: passenger_name
  - user: |
      my name is Wanjiru Kariuki
    intent: inform
  - action: new_booking_form
  - slot_was_set:
    - requested_slot: passenger_email
  - user: |
      wanjiru.kariuki@example.com
    intent: inform
  - action: new_booking_form
  - slot_was_set:
    - requested_slot: confirm_booking
  - user: |
      yes please book it
    intent: affirm
  - action: new_booking_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_new_booking

- story: escalate in the middle of a form
  steps:
  - user: |
      what's my check-in status
    intent: check_in_status
  - action: check_in_status_form
  - active_loop: check_in_status_form
  - slot_was_set:
    - requested_slot: booking_reference
  - user: |
      I want to speak to a human
    intent: escalate_to_agent
  - action: action_deactivate_loop
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_escalate_to_agent

- story: baggage question and goodbye
  steps:
  - user: |
      can I carry bags that weigh 50 kg
    intent: baggage_policy
  - action: utter_baggage_policy
  - user: |
      thanks
    intent: thank_you
  - action: utter_you_are_welcome
  - user: |
      bye
    intent: goodbye
  - action: utter_goodbye
