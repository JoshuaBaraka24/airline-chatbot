version: "3.1"

rules:

- rule: greet
  steps:
  - intent: greet
  - action: utter_greet

- rule: say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: respond to thanks
  steps:
  - intent: thank_you
  - action: utter_you_are_welcome

- rule: bot capabilities
  steps:
  - intent: bot_capabilities
  - action: utter_bot_capabilities

- rule: baggage policy
  steps:
  - intent: baggage_policy
  - action: utter_baggage_policy

- rule: check-in procedure
  steps:
  - intent: check_in_procedure
  - action: utter_check_in_procedure

- rule: handle out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: escalate to human agent
  steps:
  - intent: escalate_to_agent
  - action: action_escalate_to_agent

- rule: ask to rephrase on fallback, escalate on repeat
  steps:
  - intent: nlu_fallback
  - action: action_handle_fallback

- rule: affirm with nothing pending
  steps:
  - intent: affirm
  - action: utter_how_can_i_help

- rule: deny with nothing pending
  steps:
  - intent: deny
  - action: utter_no_problem

# --- flight status ---

- rule: activate flight status form
  steps:
  - intent: check_flight_status
  - action: flight_status_form
  - active_loop: flight_status_form

- rule: submit flight status form
  condition:
  - active_loop: flight_status_form
  steps:
  - action: flight_status_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_flight_status

- rule: stop flight status form on request
  condition:
  - active_loop: flight_status_form
  steps:
  - intent: deny
  - action: action_deactivate_loop
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_stop_task

- rule: escalate during flight status form
  condition:
  - active_loop: flight_status_form
  steps:
  - intent: escalate_to_agent
  - action: action_deactivate_loop
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_escalate_to_agent

