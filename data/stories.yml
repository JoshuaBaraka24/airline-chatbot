version: "3.1"

# Multi-turn conversations combining several tasks. Single-step behaviour
# (form activation, submission, FAQs) is defined in rules.yml; these
# stories teach TEDPolicy how tasks follow one another.

stories:

- story: greet, check flight status, then ask about baggage
  steps:
  - intent: greet
  - action: utter_greet
  - intent: check_flight_status
    entities:
    - flight_number: "KQ101"
  - action: flight_status_form
  - active_loop: flight_status_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_flight_status
  - intent: baggage_policy
  - action: utter_baggage_policy
  - intent: thank_you
  - action: utter_you_are_welcome

- story: flight status without a flight number
  steps:
  - intent: check_flight_status
  - action: flight_status_form
  - active_loop: flight_status_form
  - slot_was_set:
    - requested_slot: flight_number
  - intent: inform
    entities:
    - flight_number: "KQ202"
  - action: flight_status_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_flight_status

- story: change booking over several turns and confirm
  steps:
  - intent: change_booking
  - action: change_booking_form
  - active_loop: change_booking_form
  - slot_was_set:
    - requested_slot: booking_reference
  - intent: inform
    entities:
    - booking_reference: "BK001"
  - action: change_booking_form
  - slot_was_set:
    - requested_slot: travel_date
  - intent: inform
    entities:
    - date: "next Friday"
  - action: change_booking_form
  - slot_was_set:
    - requested_slot: confirm_change
  - intent: affirm
  - action: change_booking_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_change_booking
  - intent: goodbye
  - action: utter_goodbye

- story: cancel booking, then decline at confirmation
  steps:
  - intent: cancel_booking
    entities:
    - booking_reference: "BK003"
  - action: cancel_booking_form
  - active_loop: cancel_booking_form
  - slot_was_set:
    - requested_slot: confirm_cancel
  - intent: deny
  - action: cancel_booking_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_cancel_booking

- story: new booking collecting route and date
  steps:
  - intent: new_booking
    entities:
    - city: "Dubai"
      role: to
  - action: new_booking_form
  - active_loop: new_booking_form
  - slot_was_set:
    - requested_slot: origin
  - intent: inform
    entities:
    - city: "Nairobi"
  - action: new_booking_form
  - slot_was_set:
    - requested_slot: travel_date
  - intent: inform
    entities:
    - date: "25 October"
  - action: new_booking_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_new_booking

- story: capabilities, then check-in status and procedure
  steps:
  - intent: bot_capabilities
  - action: utter_bot_capabilities
  - intent: check_in_status
    entities:
    - booking_reference: "BK002"
  - action: check_in_status_form
  - active_loop: check_in_status_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_in_status
  - intent: check_in_procedure
  - action: utter_check_in_procedure

- story: abandon a cancellation midway
  steps:
  - intent: cancel_booking
  - action: cancel_booking_form
  - active_loop: cancel_booking_form
  - slot_was_set:
    - requested_slot: booking_reference
  - intent: deny
  - action: action_deactivate_loop
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_stop_task
  - intent: thank_you
  - action: utter_you_are_welcome
